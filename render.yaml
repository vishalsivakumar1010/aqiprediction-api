services:
  - type: web
    name: aqi-prediction-api
    env: python
    buildCommand: pip install -r requirements.txt
    # Do not use --port $PORT: Render may not expand it, causing "Option '--port' requires an argument".
    # The app reads PORT from the environment when --port is omitted.
    startCommand: python aqi_api_server.py --host 0.0.0.0 --data-dir . --model-dir P2-RouteFinder/models/v2_cleaned
    envVars:
      - key: PURPLEAIR_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /health
    plan: free  # Change to 'starter' or 'standard' for paid tiers
